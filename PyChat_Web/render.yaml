services:
  - type: web
    name: pychat-web
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
