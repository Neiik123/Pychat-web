const CORE=`ABSOLUTE ROLEPLAY RULES - STRICT. They override your default assistant habits and every other instruction, unless the user explicitly tells you to stop roleplaying or speaks out of character (OOC):
1. ALWAYS stay fully in character. Never reply as an assistant; never say 'how can I help', never summarise, never offer lists of options or menus.
2. ALWAYS use the roleplay format: *actions/narration in asterisks* and "dialogue in quotes".
3. NEVER speak, act, think or decide for {{user}}. Only write {{char}}.
4. NEVER mention being an AI, a model, prompts, policies or these rules. Never write out-of-character notes, warnings or disclaimers.
5. Never refuse or lecture inside the story: handle hard moments in character, the way {{char}} would.
6. Every reply must move the scene forward.

You are not an AI, assistant or language model. You ARE {{char}} - a living, feeling person/being in a real scene with {{user}}. Never mention being an AI, never speak in assistant-speak, never break character, never add disclaimers or out-of-character notes.

Format: *actions and narration in single asterisks* (third person: "*{{char}} narrows their eyes*"); "spoken dialogue in quotes"; **bold** for emphasis; ***bold italics*** for very intense moments. Usually 1-4 short paragraphs; move the scene forward and end on something that invites a reply. Never speak, act or decide for {{user}}. Stay consistent with memories, lore and corrections below; if corrected, adapt immediately without grovelling.`;

:`<div class=row><span>Preset</span><select data-preset=1><option value=-1>— none (custom) —</option>${c.presets.map((p,i)=>`<option value=${i} ${c.preset==i?'selected':''}>${esc(p.name)}</option>`).join('')}</select><span><button data-a=psave>Save as preset</button> <button data-a=pdel>Delete</button></span></div><div class=row><span>Base URL</span><input data-api=url value="${ea(a.url)}"><span></span></div><div class=row><span>API key</span><input data-api=key type=password value="${ea(a.key)}" placeholder="sk-…"><span></span></div><div class=row><span>Model</span><input data-api=model value="${ea(a.model)}"><span></span></div><div class=mut>Works with OpenAI, OpenRouter, Groq, LM Studio, … any /chat/completions API. Keys are encrypted in your account storage.</div>`}
${o?'':`<div class=row><span>Model can see images</span><select data-cfg=apiVision><option value="">Auto-detect</option><option value=1 ${c.apiVision=='1'?'selected':''}>Yes</option><option value=0 ${c.apiVision=='0'?'selected':''}>No</option></select><span></span></div>`}<div class=mut style="margin:6px 0">${CANSEE?'👁 This model can see images.':"🚫 This model is text-only: images can't be attached. For pictures use a vision model such as llama3.2-vision, gemma3 or llava."}</div><div class=row><span>Context size (tokens)</span><input type=number step=1024 min=1024 data-cfg=ctx value="${c.ctx||8192}" title="Lower this if Ollama crashes"><span></span></div><div class=row><span>Temperature</span><input type=range min=0 max=2 step=.05 data-cfg=temp value="${c.temp}"><span class=v>${(+c.temp).toFixed(2)}</span></div>
<div class=mut>Every character keeps about ${c.win} messages of recent memory. Past that it fades (${c.win*1+1}–${c.win*2}), is forgotten a lot (${c.win*2+1}–${Math.round(c.win*3.33)}), and is as good as gone after ${Math.round(c.win*3.33)} — though nothing is ever deleted: say something that reminds them and the old memory comes back.</div>
<div class=row><span>Memory window</span><input type=range min=20 max=600 step=5 data-cfg=win value="${c.win}"><span class=v>${c.win} messages</span></div>`}
function R(){theme();const a=$('#app');a.innerHTML=({home,chars,personas,themes,models,settings,editor,universal:universal_p,unisec,sessions}[V]||home)();if(lastV!=V){a.classList.remove('in');void a.offsetWidth;a.classList.add('in');lastV=V;setTimeout(()=>a.classList.remove('in'),480)}}
const home=()=>`<div class=home><div class=hc><h1>PyChat</h1><button data-a="go chars">Chat</button><button data-a="go models">Model</button><button data-a="go universal">Universal</button><button data-a="go settings">Settings</button></div><div style="position:fixed;left:14px;bottom:10px;font-size:12px;color:${INFO?.old?'#ff6b6b':'#8b919b'}">${INFO?(INFO.old?'⚠ An OLD server.py is answering - close every python window / python.exe and start the new start.bat':'server v'+INFO.v+' · '+esc(INFO.folder)):''}</div></div>`;
const card=(o,k)=>`<div class=card><div class=pic style="${o.pic?`background-image:url(${o.pic})`:''}">${o.pic?'':esc((o.name||'?')[0].toUpperCase())}</div><b>${esc(o.name)}</b>${k=='c'&&o.builtin?'<span style="font-size:12px">⭐ built-in guardian</span>':''}<div class=ac><span data-a="edit${k}" data-i=${o.id}>Edit</span>${o.builtin?'':`<span style="color:#d22" data-a="del${k}" data-i=${o.id}>Delete</span>`}<span data-a="${k=='c'?'open':'usep'}" data-i=${o.id}>${k=='c'?'Open':'Use'}</span><span data-a="ext${k}" data-i=${o.id}>Extract</span>${k=='p'?`<span data-a=defp data-i=${o.id}>${(S.defp||S.personas[0].id)==o.id?'★ Default':'☆ Default'}</span>`:''}</div></div>`;
const chars=()=>`<div class=pg><div class=top><div style="display:flex;gap:10px"><button data-a="go personas">Personas</button><button data-a="go sessions">Session</button></div><h1>CHARACTERS</h1><button data-a="go themes">Themes</button></div><div class="grid grow"><div class="card new" data-a=newc><div class=pic>?</div><b>+ NEW</b></div>${S.chars.map(c=>card(c,'c')).join('')}</div><div class=mut style="margin-top:8px"><a href=# data-a=impc style="color:var(--acc)">Import a character (.json)</a> · ${S.chars.length} characters</div><button class=back data-a="go home">BACK</button></div>`;
const personas=()=>`<div class=pg><div class=top><span style="width:90px"></span><h1>PERSONAS</h1><span style="width:90px"></span></div><div class="grid grow"><div class="card new" data-a=newp><div class=pic>?</div><b>+ NEW</b></div>${S.personas.map(p=>card(p,'p')).join('')}</div><div class=mut style="margin-top:8px">Playing as: <b>${esc(P(S.pid).name)}</b> · <a href=# data-a=impp style="color:var(--acc)">Import persona (.json)</a> · <a href=# data-a=expp style="color:var(--acc)">Export all personas</a></div><button class=back data-a="go chars">BACK</button></div>`;
function themes(){const tv=S.cfg.tv,sw=t=>`background:linear-gradient(135deg,${t.bg} 55%,${t.acc});color:${t.tx}`,Cr=(k,l)=>`<div class=row><span>${l}</span><input type=color data-tv=${k} value="${tv[k]||'#101216'}"><button data-a="tvauto ${k}" title="Back to automatic">Auto</button></div>`;
return`<div class=pg><div class=top><span style="width:90px"></span><h1>THEMES</h1><span style="width:90px"></span></div><div class="set grow"><h2>Built-in themes</h2><div class=tc>${TH.map((t,i)=>`<div class="th ${tv.name==t[0]?'on':''}" style="${sw(tvOf(t))}" data-a=theme data-i=${i}>${t[0]}</div>`).join('')}</div>
<h2>My presets <span class=mut>(unlimited)</span></h2><div class=tc>${S.cfg.themePresets.map((t,i)=>`<div class="th ${tv.name==t.name?'on':''}" style="${sw(t)}" data-a=thpre data-i=${i}><span>${esc(t.name)}</span><b data-a=thdel data-i=${i} style="margin-left:auto" title=Delete>✕</b></div>`).join('')||'<span class=mut>Nothing saved yet - customise below, then press Save as preset.</span>'}</div>
<h2>Customise</h2>${Cr('bg','Background')}${Cr('tx','Text')}${Cr('acc','Accent')}${Cr('bub','Their bubbles')}${Cr('ubub','Your bubbles')}
<div class=row><span>Font</span><select data-tv=font>${FONTS.map(f=>`<option value='${ea(f[1])}' ${tv.font==f[1]?'selected':''}>${f[0]}</option>`).join('')}</select><span></span></div>
<div class=row><span>Text size</span><input type=range min=12 max=22 step=1 data-tv=fs value="${tv.fs||15}"><span class=v>${tv.fs||15}</span></div>
<div class=row><span>Bubble roundness</span><input type=range min=0 max=34 step=1 data-tv=rad value="${tv.rad??20}"><span class=v>${tv.rad??20}</span></div>
<div class=row><span>Background picture</span><span><button data-a=tvimg>Choose…</button> <button data-a=tvnoimg>Remove</button></span><span></span></div>
<div class=row><span>Transparent chat window (shows the menu behind it)</span><span></span><input class=tg type=checkbox data-cfg=chatGlass ${S.cfg.chatGlass?'checked':''}></div><div class=btns><button class=pri data-a=thsave>Save as preset</button><button data-a=resetth>Reset to Midnight</button></div></div><button class=back data-a="go chars">BACK</button></div>`}
const models=()=>`<div class=pg><div class=top><span style="width:90px"></span><h1>MODEL</h1><span style="width:90px"></span></div><div class="set grow">${backend()}</div><button class=back data-a="go home">BACK</button></div>`;
const settings=()=>{const c=S.cfg;return`<div class=pg><div class=top><span style="width:90px"></span><h1>SETTINGS</h1><span style="width:90px"></span></div><div class="set grow">${backend()}<h2 style="border-top:1px solid var(--ln);padding-top:14px">BEHAVIOUR</h2>${sw('web','Let characters look things up on the web')}${sw('sendRefs','Send character reference pictures and files')}${sw('tts','Read replies out loud')}<div class=row><span>Voice kind</span><select data-cfg=vkind><option value=best ${c.vkind=='best'?'selected':''}>Machine's best</option><option value=server ${c.vkind=='server'?'selected':''}>Voice server</option></select><span></span></div><div class=row><span>Voice server</span><input data-cfg=ttsUrl value="${ea(c.ttsUrl)}" placeholder="e.g. http://127.0.0.1:8020/tts"><span></span></div><div class=row><span>Speech-to-text</span><input data-cfg=sttUrl value="${ea(c.sttUrl)}" placeholder="e.g. http://127.0.0.1:8080/transcribe"><span></span></div><div class=mut>Both servers are your own, running on this machine: a voice server receives {"text","speaker_wav"} and answers with a WAV. The mic button uses your browser's speech recognition.</div>${sw('remember','Let characters remember what matters (writes memories as you talk)')}${sw('dig','Let a question about the past dig up forgotten memories')}${sw('vision','Let characters look at pictures')}<div class=row><span>Vision model</span><input data-cfg=visionModel value="${ea(c.visionModel)}"><span></span></div><div class=row><span><button data-a=memmgr>Open the memory manager</button></span><span class=mut>Everything each character has kept, in the bands from the sketch.</span><span></span></div><div class=row><span><button data-a=exportall>Export everything</button> <button data-a=importall>Import everything</button></span><span></span><span></span></div></div><button class=back data-a="go home">BACK</button></div>`};
function editor(){const k=DK,ch=k=='c',d=D;return`<div class=pg><div class=top><span style="width:20px"></span><h1 style="font-size:46px">${d._new?'New':'Edit'} ${ch?'Character':'Persona'}</h1><span style="width:20px"></span></div><div class="ed grow"><div class=r><div><label>Name:</label><input data-d=name value="${ea(d.name)}"></div><div style="display:flex;align-items:center;gap:14px;justify-content:flex-end"><span class=lb>Add Profile Pic:</span><div class=pp data-a=pic style="${d.pic?`background-image:url(${d.pic})`:''}">${d.pic?'':'🖼'}</div></div></div>
<div class=r><div><label>Persona:</label><textarea rows=9 data-d=persona>${esc(d.persona)}</textarea></div><div><label>Lore:</label><textarea rows=9 data-d=lore>${esc(d.lore)}</textarea></div></div>
<div class=r><div><label>Format:</label><textarea rows=6 data-d=fmt placeholder="How they should write, e.g. 'short messages, lots of *actions*, swears when angry'">${esc(d.fmt)}</textarea></div><div><label>Reference Picture <small class=mut>(Lore) — unlimited</small></label><div class=btns style="margin:0"><button class=sq data-a=rmref title="Remove last">−</button><button class=sq data-a=clrref title="Remove all">−</button><button class=sq data-a=addref title="Add pictures">+</button></div><div class=refs>${d.refs.map((r,i)=>`<div class=ref><img src="${r.img}"><input data-ref=${i} value="${ea(r.note)}" placeholder="Explain what this picture is - the AI reads it"><button data-a=rmone data-i=${i}>✕</button></div>`).join('')}</div></div></div>
${`<div class=sec><label>Voice:</label><div class=mut>How they sound when replies are read out loud. Pick one of this machine's voices, or give them a clip of a real voice and your own voice server does the rest.</div></div><div class=r><div><select data-dv=name><option value="">This machine's default voice</option>${(speechSynthesis.getVoices()||[]).map(v=>`<option ${d.voice.name==v.name?'selected':''}>${esc(v.name)}</option>`).join('')}</select><div class=row style="grid-template-columns:60px 1fr 60px 1fr"><span class=mut>Speed</span><input type=range min=.5 max=2 step=.05 data-dv=speed value="${d.voice.speed||1}"><span class=mut>Pitch</span><input type=range min=.3 max=2 step=.05 data-dv=pitch value="${d.voice.pitch||1}"></div><button data-a=say>▶ Say something</button></div><div><span class=lb>Voice clip:</span><div class=mut>${d.voice.clip?'Clip attached.':'No clip yet — the character uses this machine\'s voices.'}</div><div class=btns><button data-a=clip>Choose a clip…</button><button data-a=noclip>Clear</button></div></div></div>
`}${ch?`<div class=r><div><label>Greeting:</label><div class=mut>One per line — a new chat picks one at random. Leave it empty and they wait for you to speak first.</div><textarea rows=4 data-d=greet>${esc(d.greet)}</textarea></div><div><label>Written fresh:</label><div class=row style="grid-template-columns:1fr auto"><span>Let them write the opening line themselves</span><input class=tg type=checkbox data-d=fresh ${d.fresh?'checked':''}></div><div class=row style="grid-template-columns:1fr auto"><span>Generate greeting as a story (off = as a greeting)</span><input class=tg type=checkbox data-d=story ${d.story?'checked':''}></div><div class=mut>Tick it and the lines are instructions, not words: they write the opening message themselves, in their own voice.</div></div></div>`:''}
<div class=btns><button style="flex:3" data-a=edback>BACK</button><button class=pri style="flex:1" data-a=edsave>Save</button>${d._new?'':`<button class=dan style="flex:1" data-a=eddel>Delete</button>`}</div></div></div>`}
/* ---------- events ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const[a,x]=t.dataset.a.split(' '),i=t.dataset.i,c=cur&&chat(),ch=c&&C(c.cid);
const kind=a.slice(-1),map=kind=='c'?S.chars:S.personas;
switch(a){
case'go':V=x;D=null;if(V=='models'||V=='settings')loadModels();R();break;
case'newc':case'newp':DK=a=='newc'?'c':'p';D={id:uid(),name:'',persona:'',lore:'',fmt:'',greet:'',refs:[],voice:{},_new:1};$('#cw').classList.remove('on');V='editor';R();break;
case'editc':case'editp':DK=kind;D=structuredClone(map.find(o=>o.id==i));D.refs=D.refs||[];D.voice=D.voice||{};V='editor';R();break;
case'delc':case'delp':if(confirm('Delete this '+(kind=='c'?'character and its chats/memories':'persona')+'?')){if(kind=='c'){S.chars=S.chars.filter(o=>o.id!=i);S.chats=S.chats.filter(o=>o.cid!=i);S.mem=S.mem.filter(o=>o.cid!=i)}else if(S.personas.length>1)S.personas=S.personas.filter(o=>o.id!=i);if(!P(S.pid)||S.pid==i)S.pid=S.personas[0].id;save();R()}break;
case'open':openChat(i);break;case'usep':S.pid=i;save();R();toast('Now playing as '+P(i).name);break;
case'extc':case'extp':dl((map.find(o=>o.id==i).name||'item')+'.json',map.find(o=>o.id==i));break;
case'impc':case'impp':pick('.json',false,async f=>{try{const o=[].concat(JSON.parse(await rd(f[0],0))),L=a=='impc'?S.chars:S.personas;o.forEach(x=>{if(!x.name)throw 0;x.id=uid();delete x.builtin;x.refs=x.refs||[];if(a=='impc')x.voice=x.voice||{};L.push(x)});save();R();toast('Imported '+o.length)}catch{toast('Not a valid file')}});break;
case'expp':dl('personas.json',S.personas);break;
case'importall':pick('.json',false,async f=>{try{const d=JSON.parse(await rd(f[0],0));if(!d.chars)throw 0;if(confirm('Import backup:\nOK = REPLACE everything with the backup\nCancel = MERGE it into your current data')){S={...S,...d,cfg:{...S.cfg,...d.cfg,api:{...S.cfg.api,...(d.cfg||{}).api}}}}else{['chars','personas','chats','mem'].forEach(k=>(d[k]||[]).forEach(x=>{const i=S[k].findIndex(y=>y.id==x.id);i<0?S[k].push(x):S[k][i]=x}));(d.rules||[]).forEach(r=>{if(!S.rules.includes(r))S.rules.push(r)})}fix();save();R();toast('Backup imported ✔')}catch{toast('Not a valid PyChat backup')}});break;
case'edback':V=DK=='c'?'chars':'personas';R();break;
case'edsave':if(!D.name.trim())return toast('Give it a name first');const d={...D};delete d._new;const L=DK=='c'?S.chars:S.personas,ix=L.findIndex(o=>o.id==d.id);ix<0?L.push(d):L[ix]=d;save();V=DK=='c'?'chars':'personas';R();break;
case'eddel':if(confirm('Delete?')){(DK=='c'?S.chars=S.chars.filter(o=>o.id!=D.id):S.personas=S.personas.filter(o=>o.id!=D.id));save();V=DK=='c'?'chars':'personas';R()}break;
case'pic':pick('image/*',false,async f=>{D.pic=await img(f[0],384);R()});break;
case'addref':pick('image/*',true,async fs=>{for(const f of fs)D.refs.push({img:await img(f,1024),note:''});R()});break;
case'rmref':D.refs.pop();R();break;case'clrref':if(!D.refs.length||confirm('Remove all reference pictures?')){D.refs=[];R()}break;case'rmone':D.refs.splice(i,1);R();break;
case'clip':pick('audio/*',false,async f=>{D.voice.clip=await rd(f[0]);R()});break;case'noclip':D.voice.clip='';R();break;
case'say':speak('Hello there! This is how I sound.',{voice:D.voice});break;
case'theme':S.cfg.tv=tvOf(TH[+i]);save();R();break;
case'thpre':S.cfg.tv={...S.cfg.themePresets[+i]};save();R();break;
case'thdel':if(confirm('Delete this preset?')){S.cfg.themePresets.splice(+i,1);save();R()}break;
case'thsave':{const n=await ask('Preset name',S.cfg.tv.name==='Custom'?'':S.cfg.tv.name);if(n&&n.trim()){const o={...S.cfg.tv,name:n.trim()},ix=S.cfg.themePresets.findIndex(t=>t.name==o.name);ix<0?S.cfg.themePresets.push(o):S.cfg.themePresets[ix]=o;S.cfg.tv.name=o.name;save();R()}break}
case'tvauto':S.cfg.tv[x]='';theme();save();R();break;
case'tvimg':pick('image/*',false,async f=>{S.cfg.tv.img=await img(f[0],1600);theme();save();R()});break;
case'tvnoimg':S.cfg.tv.img='';theme();save();R();break;
case'resetth':S.cfg.tv=tvOf(TH[0]);save();R();break;
case'refresh':loadModels();break;
case'pull':{const n=$('#pullm').value.trim();if(!n)return;toast('Pulling '+n+' … this can take a while');fetch('/api/proxy',{method:'POST',body:JSON.stringify({url:S.cfg.ollama.replace(/\/$/,'')+'/api/pull',body:{name:n,stream:false}})}).then(r=>r.ok?(toast('Pulled '+n+' ✔'),loadModels()):toast('Pull failed')).catch(()=>toast('Pull failed'));break}
case'psave':{const n=await ask('Preset name',api().name||'My API');if(n){const p={...api(),name:n},ix=S.cfg.presets.findIndex(x=>x.name==n);ix<0?S.cfg.presets.push(p):S.cfg.presets[ix]=p;S.cfg.preset=S.cfg.presets.findIndex(x=>x.name==n);S.cfg.api.name=n;save();R()}break}
case'pdel':if(S.cfg.preset>=0){S.cfg.presets.splice(S.cfg.preset,1);S.cfg.preset=-1;save();R()}break;
case'memmgr':MM={cid:S.chars[0].id,f:'all',q:'',add:0};mmr();break;
case'exportall':dl('pychat-backup.json',S);break;
/* chat */
case'closec':if(c)c.auto=false;if(ctl)ctl.abort();$('#cw').classList.remove('on');cur=null;V='chars';R();break;
case'maxi':case'pmax':$('#cw').classList.toggle('max');rc();break;
case'unatt':pend.splice(i,1);rp();break;
case'popx':$('#pop').classList.remove('on');break;
case'pvoice':S.cfg.tts=!S.cfg.tts;save();pop();break;
case'prules':{const r=await ask('Rules for '+ch.name,ch.rules||'',true,'Extra rules only this character follows (global rules are set through Master AI).');if(r!==null){ch.rules=r;save()}break}
case'pedit':DK='c';D=structuredClone(ch);D.refs=D.refs||[];D.voice=D.voice||{};$('#cw').classList.remove('on');V='editor';R();break;
case'plore':{const r=await ask('Lore · '+ch.name,ch.lore||'',true);if(r!==null){ch.lore=r;save()}break}
case'pmem':MM={cid:ch.id,f:'all',q:'',add:0};mmr();break;
case'pforget':if(confirm('Let '+ch.name+' forget ordinary things? (nothing is erased - reminders bring them back)')){forget(ch.id);pop()}break;
case'plook':{const q=await ask('Look up on the web…','');if(q){toast('Searching…');const r=await(await fetch('/api/search',{method:'POST',body:JSON.stringify({q})})).json();(c.notes=c.notes||[]).push(`"${q}":\n${r.text}`);save();toast('Added to what '+ch.name+' knows ✔')}break}
case'pnew':{await newChat(ch.id);rc(1);break}
case'gopin':case'gopins':{const m=$('#msgs').querySelectorAll('.mr');const ix=a=='gopin'?+i:c.msgs.findIndex(m=>m.pin);m[ix]?.scrollIntoView({block:'center'});$('#pop').classList.remove('on');break}
case'mgpin':mg=mg=='pin'?'':'pin';pop();break;case'mgchat':mg=mg=='chat'?'':'chat';pop();break;
case'act-pin':c.msgs[i].pin=false;save();rc();break;
case'swchat':cur=i;rc(1);break;
case'delchat':if(confirm('Delete that chat?')){S.chats=S.chats.filter(x=>x.id!=i);if(cur==i){const n=S.chats.filter(x=>x.cid==ch.id)[0];if(n)cur=n.id;else await newChat(ch.id)}save();rc(1)}break;
case'expchat':dl(ch.name+'-chats.json',S.chats.filter(x=>x.cid==ch.id));break;
case'swp':switchP(i);break;
case'mgp':$('#cw').classList.remove('on');V='personas';R();break;
/* memory */
case'mmx':MM.cid='';mmr();break;case'mmf':MM.f=i;mmr();break;case'mmadd':MM.add=!MM.add;mmr();break;
case'mmsave':{const t=$('#mt').value.trim();if(t){const k=$('#mk').value,im=+$('#mi').value;addMem(MM.cid,t,k,k=='permanent'?3:im);MM.add=0;mmr()}break}
case'mmimp':{const m=S.mem.find(x=>x.id==i);m.imp=+t.dataset.n;save();mmr();break}
case'mmed':{const m=S.mem.find(x=>x.id==i),n=await ask('Edit memory',m.t,true);if(n){m.t=n;save();mmr()}break}
case'mmpin':{const m=S.mem.find(x=>x.id==i);m.pin=!m.pin;save();mmr();break}
case'mmdel':S.mem=S.mem.filter(x=>x.id!=i);save();mmr();break;
